# portable_cluster slice 2: Kafka via Strimzi — KRaft combined mode
# (3 nodes acting as controller+broker each; no ZooKeeper), data on the
# local-path hot tier. RF 3 / min.insync.replicas 2: kill one broker and
# produce continues; kill two and it pauses until one recovers — the quorum
# floor from infra/portable_cluster/README.md.
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: lab
  namespace: kafka
spec:
  kafka:
    replicas: 3
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      default.replication.factor: 3
      min.insync.replicas: 2
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 10Gi
          class: local-path
          deleteClaim: true
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        memory: 2Gi
  entityOperator:
    topicOperator: {}
    userOperator: {}
