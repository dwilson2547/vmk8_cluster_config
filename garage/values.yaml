# Garage object storage — portable_cluster blueprint experiment (Path A on vmk8).
# Chart: deuxfleurs-org/garage script/helm/garage, appVersion v2.4.1 (pinned in
# argocd/garage.yaml). Peer discovery is Kubernetes-native (the chart installs
# the GarageNode CRD; no bootstrap peers needed). The rpcSecret is
# auto-generated by the chart and kept stable across syncs via a helm lookup,
# so no secret lands in this public repo.
garage:
  # 3x replication: each object on all three nodes — matches the quorum floor
  # in infra/portable_cluster/README.md. Kill one node, objects stay readable.
  replicationFactor: "3"
  consistencyMode: "consistent"

persistence:
  # Node-local storage on the hot tier (see docs/storage-tier-benchmark.md for
  # what that buys on this hardware). Sizes are advisory with local-path —
  # each node has ~93Gi allocatable; keep quotas/retention app-level.
  meta:
    storageClass: local-path
    size: 1Gi
  data:
    storageClass: local-path
    size: 20Gi

deployment:
  kind: StatefulSet
  replicaCount: 3
  podManagementPolicy: OrderedReady
